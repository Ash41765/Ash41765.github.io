<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        rgba(20,20,40,0.7),
        rgba(10,15,35,0.8)
    ),
    url("background.jpg") center/cover;
    font-family: Arial, sans-serif;
    color:white;
}

.container{
    text-align:center;
    width:700px;
}

.icon{
    width:80px;
    height:80px;
    border:1px solid rgba(255,255,255,0.5);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:30px;
}

.line{
    width:400px;
    height:1px;
    background:rgba(255,255,255,0.3);
    margin:25px auto;
}

h1{
    letter-spacing:8px;
    margin-bottom:20px;
}

p{
    font-size:12px;
    letter-spacing:2px;
    line-height:1.8;
    opacity:0.8;
}

.nav{
    margin-top:30px;
}

.nav a{
    text-decoration:none;
    color:white;
    border:1px solid rgba(255,255,255,0.4);
    padding:12px 30px;
    margin:0 -1px;
    transition:.3s;
}

.nav a:hover{
    background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">💎</div>

    <div class="line"></div>

    <h1>SAMPLE TEXT</h1>

    <p>
        YOU CAN ENTER ANY TEXT HERE THAT YOU DESIRE.<br>
        DO NOT WORRY ABOUT THE SYNTAX OR THE LINKS JUST YET.
    </p>

    <div class="line"></div>

    <div class="nav">
        <a href="#">INTRO</a>
        <a href="#">WORK</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
    </div>

</div>

</body>
</html>
